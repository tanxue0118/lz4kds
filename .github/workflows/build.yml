name: Build lz4kds KO

on:
  workflow_dispatch:
    inputs:
      device:
        description: '设备目录名（devices/ 下的目录名，留空则用 manual 模式）'
        required: false
        type: string
      arch:
        description: '架构路线（manual 模式必填）'
        required: false
        type: choice
        options: ['', 'oplus', 'xiaomi']
      kernel_repo:
        description: '内核源码仓库（manual 模式必填）'
        required: false
        type: string
      kernel_branch:
        description: '内核分支'
        required: false
        type: string
      kernel_release:
        description: '目标内核版本串（uname -r 全串，写入 vermagic）'
        required: false
        type: string
      clang_ver:
        description: 'Android clang 版本'
        required: false
        default: 'clang-r536225'
        type: string

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}-${{ inputs.device || 'manual' }}
  cancel-in-progress: false

jobs:
  build:
    name: Build KO
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 校验输入
        id: check
        shell: bash
        run: |
          set -euo pipefail
          DEV='${{ inputs.device }}'
          ARCH='${{ inputs.arch }}'
          REPO='${{ inputs.kernel_repo }}'
          BRANCH='${{ inputs.kernel_branch }}'
          KREL='${{ inputs.kernel_release }}'

          if [ -n "$DEV" ]; then
            if [ ! -d "devices/$DEV" ]; then
              echo "::error::devices/$DEV 不存在。仓库里的 devices/ 只有 TEMPLATE，真实设备数据需自行提交。"
              echo "mode=none" >> "$GITHUB_OUTPUT"
              exit 1
            fi
            echo "mode=device" >> "$GITHUB_OUTPUT"
            echo "device=$DEV" >> "$GITHUB_OUTPUT"
            echo "::notice::使用设备配置 devices/$DEV"
          else
            if [ -z "$ARCH" ] || [ -z "$REPO" ] || [ -z "$KREL" ]; then
              echo "::error::manual 模式必须提供 arch / kernel_repo / kernel_release"
              exit 1
            fi
            echo "mode=manual" >> "$GITHUB_OUTPUT"
            echo "::notice::manual 模式：arch=$ARCH repo=$REPO"
          fi

      - name: 安装构建依赖
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            git make python3 gcc g++ bc bison flex libssl-dev \
            kmod zip unzip xz-utils libelf-dev cpio rsync
          echo "--- 版本 ---"
          for t in git make python3 gcc; do
            printf '%-8s %s\n' "$t" "$($t --version 2>&1 | head -1)"
          done

      - name: 获取 Android clang
        id: clang
        shell: bash
        env:
          CLANG_VER: ${{ inputs.clang_ver }}
        run: |
          set -euo pipefail
          CACHE_DIR="$RUNNER_TOOL_CACHE/android-clang"
          mkdir -p "$CACHE_DIR"

          # 复用已缓存的工具链
          if [ -x "$CACHE_DIR/$CLANG_VER/bin/clang" ]; then
            echo "命中缓存: $CACHE_DIR/$CLANG_VER/bin"
            echo "bin=$CACHE_DIR/$CLANG_VER/bin" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "下载 $CLANG_VER（gitiles 归档，约 400-600MB）..."
          URL="https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/main/$CLANG_VER.tar.gz"
          TMP="$CACHE_DIR/clang.tar.gz"
          mkdir -p "$CACHE_DIR/$CLANG_VER"

          if curl -fL --retry 3 --retry-delay 5 --connect-timeout 30 --max-time 1500 \
                -o "$TMP" "$URL"; then
            tar xzf "$TMP" -C "$CACHE_DIR/$CLANG_VER"
            rm -f "$TMP"
          else
            echo "::warning::归档下载失败，回退 git 浅克隆（约 2GB）"
            rm -rf "$CACHE_DIR/repo"
            git clone --depth=1 https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 "$CACHE_DIR/repo"
            FOUND=$(ls -d "$CACHE_DIR/repo"/clang-r*/bin 2>/dev/null | head -1)
            if [ -z "$FOUND" ]; then
              echo "::error::未找到 clang-r*/bin"
              exit 1
            fi
            echo "bin=$FOUND" >> "$GITHUB_OUTPUT"
            echo "CLANG_BIN=$FOUND" >> "$GITHUB_ENV"
            exit 0
          fi

          if [ ! -x "$CACHE_DIR/$CLANG_VER/bin/clang" ]; then
            echo "::error::$CLANG_VER/bin/clang 不存在，请检查版本号"
            ls -la "$CACHE_DIR/$CLANG_VER" | head -20
            exit 1
          fi
          echo "bin=$CACHE_DIR/$CLANG_VER/bin" >> "$GITHUB_OUTPUT"

      - name: 缓存 clang（下次加速）
        uses: actions/cache@v4
        with:
          path: ${{ runner.tool_cache }}/android-clang
          key: android-clang-${{ inputs.clang_ver }}-v1

      - name: 准备设备配置（manual 模式）
        if: steps.check.outputs.mode == 'manual'
        shell: bash
        env:
          ARCH: ${{ inputs.arch }}
          REPO: ${{ inputs.kernel_repo }}
          BRANCH: ${{ inputs.kernel_branch }}
          KREL: ${{ inputs.kernel_release }}
        run: |
          set -euo pipefail
          DEV="manual-$(echo "$KREL" | tr -c 'A-Za-z0-9._-' '-' | cut -c1-40)"
          mkdir -p "devices/$DEV"

          cat > "devices/$DEV/build.conf" <<EOF
          [device]
          model = manual
          kmi = $(echo "$KREL" | grep -oE 'android[0-9]+-[0-9]+\.[0-9]+' | head -1 || echo unknown)
          kernel_release = $KREL

          [arch]
          type = $ARCH

          [kernel]
          repo = $REPO
          branch = $BRANCH
          depth = 1

          [build]
          source_dir =
          module_path =
          ko_name =
          extra_ko =
          crc_ref_ko =
          clang_dir =
          extra_make_flags =

          [pack]
          algo = lz4kds
          EOF
          # 去掉 heredoc 的公共缩进
          sed -i 's/^          //' "devices/$DEV/build.conf"

          # pipeline 需要的基础文件（manual 模式无真机取证，走宽松路径）
          echo "$KREL" > "devices/$DEV/uname.txt"
          echo "4096" > "devices/$DEV/page_size.txt"
          echo "CONFIG_ZRAM=m" > "devices/$DEV/config.txt"
          echo "CONFIG_MODVERSIONS=y" >> "devices/$DEV/config.txt"
          : > "devices/$DEV/kallsyms.txt"

          echo "DEV=$DEV" >> "$GITHUB_ENV"
          echo "::notice::生成设备目录 devices/$DEV"

      - name: 同步 tool 执行权限
        shell: bash
        run: chmod +x pipeline.sh tools/*.sh

      - name: 运行流水线
        shell: bash
        env:
          ANDROID_CLANG: ${{ steps.clang.outputs.bin }}
        run: |
          set -uo pipefail
          DEV="${DEV:-${{ inputs.device }}}"
          echo "===== 开始构建: devices/$DEV ====="
          bash pipeline.sh "devices/$DEV" 2>&1 | tee pipeline.out
          RC=${PIPESTATUS[0]}
          echo "pipeline rc=$RC"
          exit $RC

      - name: 显示构建日志
        if: always()
        shell: bash
        run: |
          DEV="${DEV:-${{ inputs.device }}}"
          for f in "devices/$DEV/RESULT.md" "work/$DEV/build.log"; do
            if [ -f "$f" ]; then
              echo "========== $f =========="
              tail -100 "$f"
            fi
          done

      - name: 上传模块包
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: lz4kds-module
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 30

      - name: 上传 KO 与日志（便于排查）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-debug
          path: |
            devices/*/RESULT.md
            devices/*/built-*.ko
            work/*/build.log
            pipeline.out
          if-no-files-found: ignore
          retention-days: 7

      - name: 失败提示
        if: failure()
        shell: bash
        run: |
          cat <<'MSG'
          ::error::构建失败。请查看 build-debug 产物中的 build.log。

          常见原因：
            — 内核源码树与目标内核不匹配（olddefconfig 报错）
            — 缺少厂商私有源码（编译 undefined）
            — manual 模式没有 kallsyms.txt，符号闸门无法验证（会跳过或报错）
            — clang 版本与内核要求不符

          manual 模式只做"能否编过"的验证；要产出真正可刷的包，
          需要把真机取证文件（devices/<设备>/）提交到仓库。
          MSG
