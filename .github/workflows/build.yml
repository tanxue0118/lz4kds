name: Build ACK 6.6 LZ4KDS

on:
  workflow_dispatch:
    inputs:
      ack_commit:
        description: 'ACK android15-6.6 kernel/common 提交'
        type: string
        default: 329f9ae918a9e18da3c488e531adf9b7995e2aae
  push:
    branches: [main, ack-lz4kds-ci]
    paths:
      - '.github/workflows/build.yml'
      - 'patches/ack/**'

permissions:
  contents: read

concurrency:
  group: ack-zram-${{ github.ref }}-${{ inputs.ack_commit || '329f9ae918a9e18da3c488e531adf9b7995e2aae' }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ARM64 ACK zram
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      ACK_BRANCH: common-android15-6.6
      ACK_COMMIT: ${{ inputs.ack_commit || '329f9ae918a9e18da3c488e531adf9b7995e2aae' }}
    steps:
      - name: Checkout project
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Repo and host dependencies
        shell: bash
        run: |
          ACK_ROOT="$RUNNER_TEMP/ack"
          BUILD_INFO="$RUNNER_TEMP/ack-build-info"
          DIST="$RUNNER_TEMP/ack-dist"
          ARTIFACT="$RUNNER_TEMP/ack-zram-artifact"
          {
            printf 'ACK_ROOT=%s\n' "$ACK_ROOT"
            printf 'BUILD_INFO=%s\n' "$BUILD_INFO"
            printf 'DIST=%s\n' "$DIST"
            printf 'ARTIFACT=%s\n' "$ARTIFACT"
          } >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/bin" "$ACK_ROOT" "$BUILD_INFO" "$DIST" "$ARTIFACT"
          sudo apt-get update -qq
          sudo apt-get install -y -qq bc bison flex libc6-dev libelf-dev libssl-dev libncurses-dev binutils file
          curl --fail --show-error --silent --location --retry 3 \
            --output "$RUNNER_TEMP/bin/repo" https://storage.googleapis.com/git-repo-downloads/repo
          chmod +x "$RUNNER_TEMP/bin/repo"
          printf '%s\n' "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          df -h "$ACK_ROOT"

      - name: Sync AOSP kernel and its toolchain
        shell: bash
        working-directory: ${{ env.ACK_ROOT }}
        run: |
          repo init -u https://android.googlesource.com/kernel/manifest \
            -b "$ACK_BRANCH" --depth=1 --no-tags
          repo sync -c --no-tags --fail-fast -j4
          [[ $ACK_COMMIT =~ ^[0-9a-f]{40}$ ]]
          git -C common fetch --depth=1 https://android.googlesource.com/kernel/common "$ACK_COMMIT"
          git -C common checkout --detach FETCH_HEAD
          actual=$(git -C common rev-parse HEAD)
          if [[ $actual != "$ACK_COMMIT" ]]; then
            echo "::error::ACK commit mismatch: expected $ACK_COMMIT got $actual"
            exit 1
          fi
          repo manifest -r -o "$BUILD_INFO/manifest.xml"
          printf '%s\n' "$actual" > "$BUILD_INFO/ack-commit.txt"
          df -h .

      - name: Apply ACK LZ4KDS patches
        id: patches
        shell: bash
        run: |
          export LC_ALL=C
          shopt -s nullglob
          patches=("$GITHUB_WORKSPACE/patches/ack/$ACK_BRANCH/"*.patch)
          if (( ${#patches[@]} == 0 )); then
            echo "::error::No ACK LZ4KDS patch set found for $ACK_BRANCH"
            exit 1
          fi
          variant=patched
          : > "$BUILD_INFO/patches.sha256"
          for patch in "${patches[@]}"; do
            printf 'Checking %s\n' "${patch##*/}"
            git -C "$ACK_ROOT/common" apply --check "$patch"
            printf 'Applying %s\n' "${patch##*/}"
            git -C "$ACK_ROOT/common" apply --index "$patch"
            (cd "$(dirname "$patch")" && sha256sum "${patch##*/}") >> "$BUILD_INFO/patches.sha256"
          done
          grep -Fx 'CONFIG_ZRAM_SDDC=y' "$ACK_ROOT/common/arch/arm64/configs/gki_defconfig"
          grep -Fx 'CONFIG_ZRAM_DEF_COMP_LZ4KDS=y' "$ACK_ROOT/common/arch/arm64/configs/gki_defconfig"
          printf 'variant=%s\n' "$variant" >> "$GITHUB_OUTPUT"
          printf 'ack_branch=%s\nack_commit=%s\nvariant=%s\nproject_commit=%s\n' \
            "$ACK_BRANCH" "$ACK_COMMIT" "$variant" "$GITHUB_SHA" > "$BUILD_INFO/build.txt"

      - name: Build ARM64 GKI with Kleaf
        shell: bash
        working-directory: ${{ env.ACK_ROOT }}
        run: |
          tools/bazel run \
            --//build/kernel/kleaf:preserve_kbuild_output=true \
            //common:kernel_aarch64_dist -- --destdir="$DIST" \
            2>&1 | tee "$BUILD_INFO/build.log"
          BAZEL_BIN="$(tools/bazel info bazel-bin)"
          CONFIG="$BAZEL_BIN/common/kernel_aarch64/kbuild_output/.config"
          if [[ ! -s "$CONFIG" ]]; then
            echo "::error::Kleaf did not preserve the kernel_aarch64 .config at $CONFIG"
            exit 1
          fi
          cp "$CONFIG" "$BUILD_INFO/kernel-aarch64.config"
          assert_kernel_config() {
            if ! grep -Fqx -- "$1" "$CONFIG"; then
              echo "::error::Kleaf .config is missing: $1"
              exit 1
            fi
          }
          assert_kernel_config 'CONFIG_ARM64=y'
          assert_kernel_config 'CONFIG_64BIT=y'
          assert_kernel_config 'CONFIG_ARM64_4K_PAGES=y'
          assert_kernel_config 'CONFIG_ZRAM=m'
          assert_kernel_config 'CONFIG_ZRAM_SDDC=y'
          assert_kernel_config 'CONFIG_ZRAM_DEF_COMP_LZ4KDS=y'
          assert_kernel_config 'CONFIG_ZRAM_DEF_COMP="lz4kds"'

      - name: Verify zram.ko contains LZ4KDS
        shell: bash
        run: |
          find "$DIST" -type f -name zram.ko -print > "$BUILD_INFO/zram-paths.txt"
          mapfile -t modules < "$BUILD_INFO/zram-paths.txt"
          if (( ${#modules[@]} != 1 )); then
            echo "::error::Expected exactly one zram.ko in the Kleaf dist; found ${#modules[@]}"
            exit 1
          fi
          ko=${modules[0]}
          file "$ko" | tee "$BUILD_INFO/ko-file.txt"
          readelf -h "$ko" > "$BUILD_INFO/ko-elf-header.txt"
          grep -E "Machine:[[:space:]]+AArch64" "$BUILD_INFO/ko-elf-header.txt"
          strings "$ko" | grep -Fx 'lz4kds' > /dev/null
          nm --defined-only "$ko" > "$BUILD_INFO/ko-symbols.txt"
          for symbol in zram_sddc_create zram_sddc_read_page \
              crystal_lz4kd_encode crystal_lz4kd_decode \
              crystal_lz4kd_encode_delta crystal_lz4kd_decode_delta; do
            awk '{print $NF}' "$BUILD_INFO/ko-symbols.txt" | grep -Fx "$symbol"
          done
          cp "$ko" "$ARTIFACT/zram-android15-6.6.ko"
          cp "$ko" "$ARTIFACT/zram.ko"
          cp "$BUILD_INFO/"{manifest.xml,ack-commit.txt,patches.sha256,build.txt} "$ARTIFACT/"
          (
            cd "$ARTIFACT"
            sha256sum zram-android15-6.6.ko > zram-android15-6.6.ko.sha256
            sha256sum zram.ko > zram.ko.sha256
          )
          {
            printf '### ACK LZ4KDS zram.ko\n\n- Manifest: `%s`\n- ACK commit: `%s`\n- Variant: patched\n' \
              "$ACK_BRANCH" "$(<"$BUILD_INFO/ack-commit.txt")"
            printf '\nArtifact includes `zram-android15-6.6.ko` (version-labelled handoff) and `zram.ko` (module-template filename), with SHA-256 files for both. Device boot/readback remains separate.\n'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload zram.ko
        uses: actions/upload-artifact@v4
        with:
          name: zram-${{ env.ACK_BRANCH }}-${{ steps.patches.outputs.variant }}
          path: ${{ env.ARTIFACT }}/
          if-no-files-found: error
          retention-days: 14

      - name: Run LZ4KDS KUnit on UML
        if: steps.patches.outputs.variant == 'patched' && env.ACK_BRANCH == 'common-android15-6.6'
        shell: bash
        run: |
          cd "$ACK_ROOT/common"
          cat > "$RUNNER_TEMP/lz4kds.kunitconfig" <<'EOF'
          CONFIG_KUNIT=y
          CONFIG_BLOCK=y
          CONFIG_SYSFS=y
          CONFIG_CRYPTO=y
          CONFIG_64BIT=y
          CONFIG_ZRAM=y
          CONFIG_ZRAM_SDDC=y
          CONFIG_ZRAM_SDDC_KUNIT_TEST=y
          CONFIG_CRYPTO_LZO=y
          CONFIG_CRYPTO_LZ4=y
          CONFIG_CRYPTO_ZSTD=y
          EOF
          python3 tools/testing/kunit/kunit.py run \
            --arch=um \
            --kunitconfig="$RUNNER_TEMP/lz4kds.kunitconfig" \
            --build_dir="$RUNNER_TEMP/kunit-build" \
            --jobs=4 \
            --json="$BUILD_INFO/kunit.json" 'zram-sddc-*' 2>&1 | tee "$BUILD_INFO/kunit.log"

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ack-build-diagnostics
          path: ${{ env.BUILD_INFO }}/
          if-no-files-found: ignore
          retention-days: 7
