name: Build AOSP ACK zram.ko

on:
  workflow_dispatch:
    inputs:
      manifest_branch:
        description: 'AOSP ACK manifest 分支（ARM64 / 4 KiB）'
        type: choice
        default: common-android15-6.6
        options:
          - common-android14-6.1
          - common-android15-6.6
          - common-android16-6.12
  push:
    branches: [main]
    paths:
      - '.github/workflows/build.yml'
      - 'patches/ack/**'

permissions:
  contents: read

concurrency:
  group: ack-zram-${{ github.ref }}-${{ inputs.manifest_branch || 'common-android15-6.6' }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ARM64 ACK zram
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      ACK_BRANCH: ${{ inputs.manifest_branch || 'common-android15-6.6' }}
    steps:
      - name: Checkout project
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Repo and host dependencies
        shell: bash
        run: |
          ACK_ROOT="$RUNNER_TEMP/ack"
          BUILD_INFO="$RUNNER_TEMP/ack-build-info"
          DIST="$RUNNER_TEMP/ack-dist"
          ARTIFACT="$RUNNER_TEMP/ack-zram-artifact"
          {
            printf 'ACK_ROOT=%s\n' "$ACK_ROOT"
            printf 'BUILD_INFO=%s\n' "$BUILD_INFO"
            printf 'DIST=%s\n' "$DIST"
            printf 'ARTIFACT=%s\n' "$ARTIFACT"
          } >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/bin" "$ACK_ROOT" "$BUILD_INFO" "$DIST" "$ARTIFACT"
          sudo apt-get update -qq
          sudo apt-get install -y -qq bc bison flex libc6-dev libelf-dev libssl-dev
          curl --fail --show-error --silent --location --retry 3 \
            --output "$RUNNER_TEMP/bin/repo" https://storage.googleapis.com/git-repo-downloads/repo
          chmod +x "$RUNNER_TEMP/bin/repo"
          printf '%s\n' "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          df -h "$ACK_ROOT"

      - name: Sync AOSP kernel and its toolchain
        shell: bash
        working-directory: ${{ env.ACK_ROOT }}
        run: |
          repo init -u https://android.googlesource.com/kernel/manifest \
            -b "$ACK_BRANCH" --depth=1 --no-tags
          repo sync -c --no-tags --fail-fast -j4
          repo manifest -r -o "$BUILD_INFO/manifest.xml"
          git -C common rev-parse HEAD > "$BUILD_INFO/ack-commit.txt"
          df -h .

      - name: Apply optional ACK patches
        id: patches
        shell: bash
        run: |
          export LC_ALL=C
          shopt -s nullglob
          patches=("$GITHUB_WORKSPACE/patches/ack/$ACK_BRANCH/"*.patch)
          variant=baseline
          : > "$BUILD_INFO/patches.sha256"
          if (( ${#patches[@]} )); then
            variant=patched
            for patch in "${patches[@]}"; do
              printf 'Applying %s\n' "${patch##*/}"
              git -C "$ACK_ROOT/common" apply --index "$patch"
              (cd "$(dirname "$patch")" && sha256sum "${patch##*/}") >> "$BUILD_INFO/patches.sha256"
            done
            git -C "$ACK_ROOT/common" diff --cached --check
          fi
          printf 'variant=%s\n' "$variant" >> "$GITHUB_OUTPUT"
          printf 'manifest_branch=%s\nvariant=%s\nproject_commit=%s\n' \
            "$ACK_BRANCH" "$variant" "$GITHUB_SHA" > "$BUILD_INFO/build.txt"

      - name: Build ARM64 GKI with Kleaf
        shell: bash
        working-directory: ${{ env.ACK_ROOT }}
        run: |
          tools/bazel run //common:kernel_aarch64_dist -- --destdir="$DIST" \
            2>&1 | tee "$BUILD_INFO/build.log"

      - name: Collect zram.ko and build metadata
        shell: bash
        env:
          VARIANT: ${{ steps.patches.outputs.variant }}
        run: |
          find "$DIST" -type f -name zram.ko -print > "$BUILD_INFO/zram-paths.txt"
          mapfile -t modules < "$BUILD_INFO/zram-paths.txt"
          if (( ${#modules[@]} != 1 )); then
            echo "::error::Expected exactly one zram.ko in the Kleaf dist; found ${#modules[@]}"
            exit 1
          fi
          cp "${modules[0]}" "$ARTIFACT/zram.ko"
          cp "$BUILD_INFO/"{manifest.xml,ack-commit.txt,patches.sha256,build.txt} "$ARTIFACT/"
          (cd "$ARTIFACT" && sha256sum zram.ko > zram.ko.sha256)
          {
            printf '### ACK zram.ko\n\n- Manifest: `%s`\n- ACK commit: `%s`\n- Variant: `%s`\n' \
              "$ACK_BRANCH" "$(<"$BUILD_INFO/ack-commit.txt")" "$VARIANT"
            printf '\n此产物对应本次 ACK 构建，真机兼容性和运行时读回需单独验证。\n'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload zram.ko
        uses: actions/upload-artifact@v4
        with:
          name: zram-${{ env.ACK_BRANCH }}-${{ steps.patches.outputs.variant }}
          path: ${{ env.ARTIFACT }}/
          if-no-files-found: error
          retention-days: 14

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ack-build-diagnostics
          path: ${{ env.BUILD_INFO }}/
          if-no-files-found: ignore
          retention-days: 7
