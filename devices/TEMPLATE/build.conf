; build.conf —— 流水线输入配置 (AI 按 AGENTS.md 第 3/6 节填写)
; 注释用 ; 或 #
;
; 【重要】[build] 段的 module_path / ko_name / extra_ko / crc_ref_ko / source_dir
; 留空即可，pipeline 会按 [arch] type 自动填正确值。
; 只有需要覆盖默认行为时才手工填写（填错会被 pipeline 校验并报错）。

[device]
model = TEMPLATE
kmi = android15-6.6
kernel_release = 6.6.89-android15-8-o-gxxxx

[arch]
; 架构路线 —— 决定用哪套模板、源码、替换对象
;   auto   = （推荐）从取证包自动判定：有 oplus_bsp_hybridswap_zram.ko → oplus；
;            只有标准 zram.ko → xiaomi；判定失败则报错人工介入
;   oplus  = OPPO/realme 系（替换 oplus_bsp_hybridswap_zram.ko + oplus_bsp_zsmalloc.ko）
;   xiaomi = 标准 zram 系（替换 system_dlkm 的 zram.ko）
type = auto

[kernel]
; 厂商内核源码树 (AI 按查找表填) —— repo+branch 或 local_tree 二选一
repo =
branch =
; local_tree =
depth = 1

[build]
; ==== 以下 5 项留空 = 按 arch 自动填 ====
; 源码目录（相对工作区根）
;   oplus  → source-oplus      （OPPO hybridswap 骨架）
;   xiaomi → source-xiaomi     （Crystal HybridSwap 完整驱动）
source_dir =
; 源码放置到内核树内的路径
;   oplus  → vendor/oplus/kernel/mm/hybridswap_zram
;   xiaomi → drivers/block/zram
module_path =
; 编译产物 KO 名
;   oplus  → oplus_bsp_hybridswap_zram.ko
;   xiaomi → zram.ko
ko_name =
; 额外打包的设备 KO（相对设备文件夹）
;   oplus  → 需填 oplus_bsp_zsmalloc.ko（留空则自动在取证包里找）
;   xiaomi → 无需
extra_ko =
; CRC 对齐参照物（相对设备文件夹；留空则自动在取证包里找）
crc_ref_ko =
; ==== 以下需手工填 ====
; 工具链（留空则自动克隆到 work/clang）
clang_dir =
; 额外 make 参数（一般留空）
extra_make_flags =

[pack]
; 本模块只做侧载，不干预容量；algo 写入 oplus 的 preinit.conf（xiaomi 运行时写入）
algo = lz4kds
